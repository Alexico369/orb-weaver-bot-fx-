<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orb-weaver-bot-FX | Trading Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #0f1015;
            --accent-green: #00ff66;
            --accent-red: #ff3333;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --text-main: #f0f0f5;
            --text-muted: #8a8b9f;
            --border-color: #1f2233;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 480px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: var(--accent-green); display: flex; align-items: center; gap: 8px; }
        .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; background: rgba(255,51,51,0.15); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-badge.active { background: var(--accent-glow); color: var(--accent-green); border-color: var(--accent-green); }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .metric-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; }
        .metric-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 20px; font-weight: 700; color: var(--text-main); }
        .metric-value.green { color: var(--accent-green); }
        .chart-container { position: relative; height: 160px; width: 100%; margin-top: 10px; }
        .controls { display: flex; gap: 12px; margin-top: 16px; }
        button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; }
        #btn-start { background: var(--accent-green); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        #btn-stop { background: #1a1c26; color: var(--accent-red); border: 1px solid var(--accent-red); }
        button:active { transform: scale(0.98); }
        .trades-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; }
        .trade-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .trade-item:last-child { border-bottom: none; }
        .trade-pair { font-weight: 700; }
        .trade-profit { font-weight: 700; }
        .trade-profit.pos { color: var(--accent-green); }
        .trade-profit.neg { color: var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <div class="logo">🕷️ ORB-WEAVER FX</div>
        <div id="status-badge" class="status-badge">Detenido</div>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">Balance / Equity</div>
            <div id="account-balance" class="metric-value green">$0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">EUR/USD Tick</div>
            <div id="eurusd-price" class="metric-value">1.08420</div>
        </div>
    </div>

    <div class="card">
        <div class="trades-title">Rendimiento en Vivo (EUR/USD Scalping)</div>
        <div class="chart-container">
            <canvas id="performanceChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div class="trades-title">Últimas Operaciones (MT5 Bridge)</div>
        <div id="trades-list">
            <div class="trade-item">
                <span class="trade-pair">EUR/USD (BUY 0.01)</span>
                <span class="trade-profit pos">+$1.40</span>
            </div>
            <div class="trade-item">
                <span class="trade-pair">EUR/USD (SELL 0.01)</span>
                <span class="trade-profit neg">-$0.30</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-start" onclick="toggleBot()">Iniciar Bot</button>
        <button id="btn-stop" onclick="stopBot()">Detener</button>
    </div>

    <script>
        let isRunning = false;
        let balance = 0.00; // Sin saldo por defecto hasta conectar MT5
        let price = 1.08420;

        const ctx = document.getElementById('performanceChart').getContext('2d');
        const performanceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1m', '2m', '3m', '4m', '5m', 'Ahora'],
                datasets: [{
                    data: [0, 0, 0, 0, 0, 0],
                    borderColor: '#00ff66',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true,
                    backgroundColor: 'rgba(0, 255, 102, 0.05)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#8a8b9f', font: { size: 10 } } },
                    y: { grid: { color: '#1f2233' }, ticks: { color: '#8a8b9f', font: { size: 10 } } }
                }
            }
        });

        function toggleBot() {
            isRunning = true;
            document.getElementById('status-badge').innerText = 'Conectando MT5...';
            document.getElementById('status-badge').className = 'status-badge active';
            setTimeout(() => {
                document.getElementById('status-badge').innerText = 'Operando (Activo)';
            }, 1500);
        }

        function stopBot() {
            isRunning = false;
            document.getElementById('status-badge').innerText = 'Detenido';
            document.getElementById('status-badge').className = 'status-badge';
        }

        setInterval(() => {
            // Simulación de fluctuación de precio en vivo para EUR/USD
            const change = (Math.random() - 0.48) * 0.0002;
            price += change;
            document.getElementById('eurusd-price').innerText = price.toFixed(5);
        }, 1000);
    </script>
</body>
</html>
